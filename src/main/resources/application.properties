spring.application.name=anime-tracker-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Carga asociaciones LAZY (ManyToOne y colecciones) en lotes: ante N proxies sin
# inicializar, Hibernate los trae con una sola query (WHERE id IN ...) en vez de N.
# Evita N+1 de forma global en feeds y listados.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Compresión gzip de las respuestas: los JSON comprimen muy bien (~70-80% menos
# bytes), lo que reduce el tiempo de transferencia por red. Solo se comprimen
# respuestas a partir de min-response-size para no malgastar CPU en payloads chicos.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}